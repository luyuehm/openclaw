packages:
  - .
  - ui
  - packages/*
  - extensions/*

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "acpx"
  - "tokenjuice"
  - "@agentclientprotocol/sdk"
  - "axios"
  - "basic-ftp"
  - "hono"
  - "openclaw"
  - "protobufjs"
  - "@buape/carbon"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@openai/codex"
  - "@openai/codex-*"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

overrides:
  # --- Core runtime chain SCA fixes (RIC-760) ---
  tar: 7.5.22
  undici@8: 8.10.2
  undici@7: 7.29.1
  "ws@8": 8.21.3
  hono: 4.13.7
  "linkify-it": 5.0.2
  "fast-uri": 3.1.7
  "basic-ftp": 5.3.1
  "brace-expansion": 5.0.9
  "form-data": 2.5.6
  "ip-address": 10.7.0
  "fast-xml-builder": 1.3.1
  # --- Existing pins (migrated from package.json pnpm.overrides) ---
  "@anthropic-ai/sdk": "0.91.0"
  "@hono/node-server": "1.19.14"
  axios: "1.18.0"
  "follow-redirects": "1.16.0"
  defu: "6.1.5"
  "fast-xml-parser": "5.7.0"
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  "file-type": "22.0.1"
  minimatch: "10.2.4"
  "path-to-regexp": "8.4.0"
  qs: "6.14.2"
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: "1.1.32"
  tough-cookie: "4.1.3"
  yauzl: "3.2.1"
  protobufjs: "7.6.1"
  uuid: "14.0.0"
  # --- Extension chain SCA fixes (RIC-761) ---
  "@grpc/grpc-js": "1.14.4"

onlyBuiltDependencies:
  - "@lydell/node-pty"
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - "@napi-rs/canvas"
  - "@tloncorp/api"
  - "@whiskeysockets/baileys"
  - authenticate-pam
  - esbuild
  - node-llama-cpp
  - protobufjs
  - sharp

ignoredBuiltDependencies:
  - koffi

packageExtensions:
  "@mariozechner/pi-coding-agent":
    dependencies:
      "strip-ansi": "^7.2.0"

peerDependencyRules:
  allowedVersions:
    "prism-media>opusscript": "^0.0.8 || ^0.1.1"
